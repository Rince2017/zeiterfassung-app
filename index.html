<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stunden">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Zeiterfassung</title>
<style>
:root {
  --bg: #f4f6f9; --karte: #ffffff; --text: #1b2430; --leise: #5d6b7c; --linie: #d9dfe7;
  --akzent: #1f4e8c; --akzent-text: #ffffff; --gut: #1d7a46; --warn: #a15c00; --warn-bg: #fff3dc; --fehler: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161d; --karte: #1b232d; --text: #e8edf3; --leise: #9aa7b6; --linie: #2f3a47;
    --akzent: #6aa2e8; --akzent-text: #0c1a2c; --gut: #5fcf8a; --warn: #f0b45c; --warn-bg: #3a2c12; --fehler: #ff8a80;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
#app { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
h1 { font-size: 24px; margin: 8px 0 16px; }
h2 { font-size: 15px; margin: 24px 0 8px; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; }
.karte { background: var(--karte); border: 1px solid var(--linie); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.leise { color: var(--leise); }
.gross { font-size: 30px; font-weight: 700; margin: 2px 0 12px; }
button, .knopf {
  font: inherit; min-height: 52px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--linie);
  background: var(--karte); color: var(--text); cursor: pointer; -webkit-tap-highlight-color: transparent;
}
button.haupt { background: var(--akzent); color: var(--akzent-text); border-color: var(--akzent); font-weight: 700; }
button.riesig { width: 100%; min-height: 76px; font-size: 24px; }
button.ende { background: var(--gut); border-color: var(--gut); color: #fff; }
button.gefahr { color: var(--fehler); }
button.breit { width: 100%; }
button:active { opacity: .7; }
.reihe { display: flex; gap: 8px; flex-wrap: wrap; }
.reihe > * { flex: 1 1 auto; }
.chip { min-height: 44px; padding: 0 14px; flex: 0 0 auto; }
.chip.an { background: var(--akzent); color: var(--akzent-text); border-color: var(--akzent); }
.hinweis { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.hinweis button { margin-top: 8px; min-height: 44px; }
.zeile {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; min-height: 60px;
  padding: 8px 14px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--linie); background: var(--karte);
}
.zeile .tag { width: 84px; font-weight: 700; flex: 0 0 auto; }
.zeile .zeit { flex: 1 1 auto; }
.zeile .dauer { font-variant-numeric: tabular-nums; font-weight: 700; }
.marke { font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--akzent); color: var(--akzent-text); }
.marke.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
.monatskopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.monatskopf button { width: 52px; padding: 0; flex: 0 0 auto; font-size: 22px; }
.monatskopf .titel { font-size: 20px; font-weight: 700; text-align: center; flex: 1 1 auto; }
label { display: block; font-size: 14px; color: var(--leise); margin: 12px 0 4px; }
input, select, textarea {
  font: inherit; width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--linie); background: var(--bg); color: var(--text);
}
.paar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
nav {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--karte);
  border-top: 1px solid var(--linie); padding-bottom: env(safe-area-inset-bottom);
}
nav button { flex: 1; border: none; border-radius: 0; background: none; min-height: 58px; color: var(--leise); font-size: 15px; }
nav button.aktiv { color: var(--akzent); font-weight: 700; }
dialog {
  width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; border: 1px solid var(--linie);
  border-radius: 16px; background: var(--karte); color: var(--text); padding: 16px;
}
dialog::backdrop { background: rgba(0, 0, 0, .5); }
#toast {
  position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 30; margin: 0 auto; max-width: 536px;
  background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 14px; display: none; gap: 12px; align-items: center;
}
#toast.sichtbar { display: flex; }
#toast span { flex: 1; }
#toast button { min-height: 40px; background: var(--bg); color: var(--text); flex: 0 0 auto; }
#sheet { position: fixed; inset: 0; z-index: 20; background: #cfd5dd; overflow: auto; display: none; }
#sheet.offen { display: block; }
#sheet .leiste { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; padding: 10px 12px; background: var(--karte); border-bottom: 1px solid var(--linie); }
#sheet .leiste button { flex: 1; }
#sheet .papier { overflow-x: auto; padding: 12px 0 40px; }
@media print {
  body > *:not(#sheet) { display: none !important; }
  #sheet { position: static; display: block; background: #fff; overflow: visible; }
  #sheet .leiste { display: none; }
  #sheet .papier { overflow: visible; padding: 0; }
  @page { size: A4 portrait; margin: 12mm; }
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-aktion="ansicht" data-wert="heute">Heute</button>
  <button data-aktion="ansicht" data-wert="monat">Monat</button>
  <button data-aktion="ansicht" data-wert="einstellungen">Einstellungen</button>
</nav>
<div id="toast"><span id="toast-text"></span><button id="toast-knopf" data-aktion="toast-knopf" hidden></button></div>

<dialog id="formular">
  <h1 id="form-titel">Eintrag</h1>
  <label for="f-datum">Datum</label>
  <input id="f-datum" type="date">
  <div class="paar">
    <div><label for="f-beginn">Beginn</label><input id="f-beginn" type="time"></div>
    <div><label for="f-ende">Ende</label><input id="f-ende" type="time"></div>
  </div>
  <div class="paar">
    <div><label for="f-pause">Pause (Minuten)</label><input id="f-pause" type="number" inputmode="numeric" min="0" step="1"></div>
    <div><label for="f-kuerzel">Kürzel</label><select id="f-kuerzel"></select></div>
  </div>
  <label for="f-bemerkung">Bemerkung</label>
  <input id="f-bemerkung" type="text" autocomplete="off">
  <label for="f-aufgezeichnet">Aufgezeichnet am</label>
  <input id="f-aufgezeichnet" type="date">
  <p id="f-fehler" class="leise" style="color:var(--fehler)" hidden></p>
  <div class="reihe" style="margin-top:16px">
    <button class="haupt" data-aktion="form-speichern">Speichern</button>
    <button data-aktion="form-abbrechen">Abbrechen</button>
  </div>
  <button id="f-loeschen" class="gefahr breit" style="margin-top:8px" data-aktion="form-loeschen" hidden>Eintrag löschen</button>
</dialog>

<section id="sheet">
  <div class="leiste">
    <button data-aktion="zettel-zu">Zurück</button>
    <button class="haupt" data-aktion="pdf">PDF (A4) teilen / drucken</button>
  </div>
  <div class="papier" id="sheet-inhalt"></div>
</section>

<input id="datei" type="file" accept=".csv,text/csv,text/plain" hidden>

<script src="logik.js?v=3"></script>
<script src="pdf.js?v=3"></script>
<script>
"use strict";
const Z = window.Zeit;
const VERSION = "1";
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

const state = {
  eintraege: [],
  einst: { name: "", firma: "", pers_nr: "", letzteSicherung: "" },
  ansicht: "heute",
  monat: Z.heuteIso().slice(0, 7),
  formularId: null,
  toastAktion: null,
};

const $ = (id) => document.getElementById(id);
const esc = Z.esc;

// ---------- Speicher (IndexedDB, Ersatz: localStorage) ----------

const Speicher = (() => {
  let db = null;
  function oeffnen() {
    return new Promise((fertig) => {
      try {
        const r = indexedDB.open("zeiterfassung", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { db = r.result; fertig(true); };
        r.onerror = () => fertig(false);
      } catch (e) { fertig(false); }
    });
  }
  function lesen(key) {
    return new Promise((fertig) => {
      if (!db) {
        try { fertig(JSON.parse(localStorage.getItem("zt_" + key))); } catch (e) { fertig(null); }
        return;
      }
      const t = db.transaction("kv").objectStore("kv").get(key);
      t.onsuccess = () => fertig(t.result === undefined ? null : t.result);
      t.onerror = () => fertig(null);
    });
  }
  function schreiben(key, wert) {
    return new Promise((fertig, fehler) => {
      if (!db) {
        try { localStorage.setItem("zt_" + key, JSON.stringify(wert)); fertig(); } catch (e) { fehler(e); }
        return;
      }
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(wert, key);
      tx.oncomplete = () => fertig();
      tx.onerror = () => fehler(tx.error);
    });
  }
  return { oeffnen, lesen, schreiben };
})();

async function speichern() {
  try {
    await Speicher.schreiben("eintraege", state.eintraege);
    await Speicher.schreiben("einstellungen", state.einst);
  } catch (e) {
    toast("Speichern auf diesem Gerät ist fehlgeschlagen. Bitte sofort eine Sicherung anlegen.");
  }
}

// ---------- Hilfen ----------

function toast(text, knopf, aktion) {
  $("toast-text").textContent = text;
  const k = $("toast-knopf");
  k.hidden = !knopf;
  k.textContent = knopf || "";
  state.toastAktion = aktion || null;
  $("toast").classList.add("sichtbar");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("sichtbar"), knopf ? 9000 : 4000);
}

function laufende() {
  const offen = state.eintraege.filter((e) => e.beginn && !e.ende && !e.kuerzel);
  return Z.sortiere(offen).pop() || null;
}

function eintragZeile(e) {
  const wd = Z.WOCHENTAGE[Z.wochentag(e.datum)];
  const t = e.datum.split("-");
  const zeit = e.beginn || e.ende ? esc(e.beginn) + "–" + (e.ende ? esc(e.ende) : "…") : "";
  const pause = e.pause_min && e.pause_min !== "0" ? ' <span class="leise">(' + esc(e.pause_min) + ' min Pause)</span>' : "";
  const dauer = e.beginn && e.ende ? Z.hhmm(Z.dauerMin(e)) : "";
  const marken = [];
  if (e.kuerzel) marken.push('<span class="marke">' + esc(e.kuerzel) + "</span>");
  if (e.beginn && !e.ende && !e.kuerzel) marken.push('<span class="marke warn">offen</span>');
  if (Z.verspaetet(e)) marken.push('<span class="marke warn">(!)</span>');
  const bem = e.bemerkung ? '<div class="leise">' + esc(e.bemerkung) + "</div>" : "";
  return '<button class="zeile" data-aktion="bearbeiten" data-wert="' + esc(e.id) + '">' +
    '<span class="tag">' + wd + " " + t[2] + "." + t[1] + ".</span>" +
    '<span class="zeit">' + zeit + pause + bem + "</span>" + marken.join(" ") +
    '<span class="dauer">' + dauer + "</span></button>";
}

function tageSeitSicherung() {
  const s = state.einst.letzteSicherung;
  return s ? Z.tageZwischen(s, Z.heuteIso()) : null;
}

function sicherungsHinweis() {
  if (!state.eintraege.length) return "";
  const t = tageSeitSicherung();
  if (t !== null && t <= 7) return "";
  const text = t === null ? "Es wurde noch keine Sicherung angelegt." : "Die letzte Sicherung liegt " + t + " Tage zurück.";
  return '<div class="hinweis">' + text + " Bitte sichern Sie Ihre Daten, damit sie bei einem Gerätewechsel nicht verloren gehen." +
    '<br><button class="haupt" data-aktion="sichern">Jetzt sichern</button></div>';
}

// ---------- Ansichten ----------

function ansichtHeute() {
  const heute = Z.heuteIso();
  const lauf = laufende();
  let status;
  if (lauf) {
    const seit = lauf.datum === heute ? "seit " + esc(lauf.beginn) + " Uhr" : "seit " + esc(lauf.beginn) + " Uhr (" + Z.datumDe(lauf.datum) + ")";
    const pause = lauf.pause_min || "0";
    const chips = ["0", "15", "30", "45", "60"].map((p) =>
      '<button class="chip' + (pause === p ? " an" : "") + '" data-aktion="pause" data-wert="' + p + '">' + p + "</button>").join("");
    status = '<div class="leise">Läuft</div><div class="gross">' + seit + "</div>" +
      '<button class="riesig ende" data-aktion="ende">Ende</button>' +
      '<label>Pause (Minuten)</label><div class="reihe">' + chips +
      '<input id="pause-frei" type="number" inputmode="numeric" min="0" step="1" value="' + esc(pause) + '" style="max-width:96px" data-aktion-change="pause-frei"></div>';
  } else {
    status = '<div class="leise">Keine laufende Arbeitszeit</div><div class="gross">' + Z.datumDe(heute) + "</div>" +
      '<button class="riesig haupt" data-aktion="start">Start</button>';
  }
  const heutige = Z.sortiere(state.eintraege.filter((e) => e.datum === heute));
  const liste = heutige.length ? heutige.map(eintragZeile).join("") : '<p class="leise">Heute noch nichts eingetragen.</p>';
  return "<h1>Zeiterfassung</h1>" + sicherungsHinweis() + '<div class="karte">' + status + "</div>" +
    "<h2>Heute</h2>" + liste +
    '<button class="breit" style="margin-top:8px" data-aktion="neu">Eintrag von Hand (Nachtrag, Krank, Urlaub …)</button>';
}

function ansichtMonat() {
  const [jahr, monat] = state.monat.split("-").map(Number);
  const liste = Z.imMonat(state.eintraege, jahr, monat);
  const summe = liste.reduce((s, e) => s + Z.dauerMin(e), 0);
  const offen = liste.filter((e) => e.beginn && !e.ende && !e.kuerzel).length;
  let inhalt = "";
  liste.forEach((e) => { inhalt += eintragZeile(e); });
  if (!liste.length) inhalt = '<p class="leise">Keine Einträge in diesem Monat.</p>';
  return '<div class="monatskopf"><button data-aktion="monat-wechsel" data-wert="-1" aria-label="Vormonat">‹</button>' +
    '<div class="titel">' + MONATE[monat - 1] + " " + jahr + '</div><button data-aktion="monat-wechsel" data-wert="1" aria-label="Folgemonat">›</button></div>' +
    '<div class="karte"><div class="leise">Summe</div><div class="gross">' + Z.hhmm(summe) + " Std.</div>" +
    (offen ? '<div class="hinweis" style="margin:0 0 12px">' + offen + " Eintrag ohne Ende („offen“).</div>" : "") +
    '<button class="haupt breit" data-aktion="zettel">Stundenzettel anzeigen</button></div>' +
    inhalt + '<button class="breit" style="margin-top:8px" data-aktion="neu">Eintrag hinzufügen</button>';
}

function ansichtEinstellungen() {
  const e = state.einst;
  const s = e.letzteSicherung ? Z.datumDe(e.letzteSicherung) : "noch nie";
  return "<h1>Einstellungen</h1>" +
    '<div class="karte"><strong>Angaben für den Stundenzettel</strong>' +
    '<label for="e-name">Name</label><input id="e-name" data-feld="name" autocomplete="off" value="' + esc(e.name) + '">' +
    '<label for="e-firma">Firma</label><input id="e-firma" data-feld="firma" autocomplete="off" value="' + esc(e.firma) + '">' +
    '<label for="e-pers">Personalnummer</label><input id="e-pers" data-feld="pers_nr" autocomplete="off" value="' + esc(e.pers_nr) + '"></div>' +
    '<div class="karte"><strong>Sicherung</strong><p class="leise">Die Daten liegen nur auf diesem Gerät. Letzte Sicherung: ' + s + ".</p>" +
    '<button class="haupt breit" data-aktion="sichern">Sichern (in „Dateien“ ablegen)</button>' +
    '<p class="leise">Wählen Sie im Menü „In Dateien sichern“ und dann einen Ordner in iCloud Drive.</p>' +
    '<button class="breit" data-aktion="wiederherstellen">Aus Datei wiederherstellen</button>' +
    '<p class="leise">Bereits vorhandene Einträge bleiben erhalten, nur neue werden ergänzt.</p></div>' +
    '<div class="karte"><button class="gefahr breit" data-aktion="alles-loeschen">Alle Daten auf diesem Gerät löschen</button></div>' +
    '<p class="leise" style="text-align:center">Version ' + VERSION + "</p>";
}

function render() {
  const a = state.ansicht;
  $("app").innerHTML = a === "heute" ? ansichtHeute() : a === "monat" ? ansichtMonat() : ansichtEinstellungen();
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("aktiv", b.dataset.wert === a));
}

// ---------- Aktionen ----------

async function start() {
  if (laufende()) { toast("Es läuft bereits eine Arbeitszeit."); return; }
  const heute = Z.heuteIso();
  state.eintraege.push({
    id: Z.neueId(), datum: heute, beginn: Z.jetztHhmm(), pause_min: "0", ende: "",
    kuerzel: "", bemerkung: "", aufgezeichnet_am: heute,
  });
  await speichern();
  render();
}

async function ende() {
  const e = laufende();
  if (!e) return;
  e.ende = Z.jetztHhmm();
  e.aufgezeichnet_am = Z.heuteIso();
  await speichern();
  render();
  toast("Ende eingetragen: " + Z.hhmm(Z.dauerMin(e)) + " Std. Jetzt sichern?", "Sichern", sichern);
}

async function setzePause(wert) {
  const e = laufende();
  if (!e) return;
  const n = parseInt(wert, 10);
  e.pause_min = String(Number.isFinite(n) && n > 0 ? n : 0);
  await speichern();
  render();
}

function formularOeffnen(id, vorgabeDatum) {
  const e = id ? state.eintraege.find((x) => x.id === id) : null;
  state.formularId = e ? e.id : null;
  $("form-titel").textContent = e ? "Eintrag bearbeiten" : "Neuer Eintrag";
  $("f-datum").value = e ? e.datum : vorgabeDatum || Z.heuteIso();
  $("f-beginn").value = e ? e.beginn : "";
  $("f-ende").value = e ? e.ende : "";
  $("f-pause").value = e ? e.pause_min || "0" : "0";
  $("f-bemerkung").value = e ? e.bemerkung : "";
  $("f-aufgezeichnet").value = e ? e.aufgezeichnet_am : Z.heuteIso();
  $("f-kuerzel").innerHTML = '<option value="">– keins –</option>' +
    Z.KUERZEL.map((k) => '<option value="' + k[0] + '">' + k[0] + " – " + esc(k[1]) + "</option>").join("");
  $("f-kuerzel").value = e ? e.kuerzel : "";
  $("f-loeschen").hidden = !e;
  $("f-fehler").hidden = true;
  $("formular").showModal();
}

function formularFehler(text) {
  const f = $("f-fehler");
  f.textContent = text;
  f.hidden = false;
}

async function formularSpeichern() {
  const datum = $("f-datum").value;
  const beginn = Z.normZeit($("f-beginn").value);
  const ende = Z.normZeit($("f-ende").value);
  const kuerzel = $("f-kuerzel").value;
  const pause = parseInt($("f-pause").value || "0", 10);
  if (!Z.istDatum(datum)) return formularFehler("Bitte ein Datum angeben.");
  if (beginn === null || ende === null) return formularFehler("Bitte gültige Uhrzeiten angeben.");
  if (ende && !beginn) return formularFehler("Zum Ende fehlt der Beginn.");
  if (!beginn && !kuerzel) return formularFehler("Bitte Beginn oder ein Kürzel angeben.");
  if (!(pause >= 0)) return formularFehler("Die Pause muss eine Zahl ab 0 sein.");
  const daten = {
    datum: datum, beginn: beginn, ende: ende, pause_min: String(pause), kuerzel: kuerzel,
    bemerkung: $("f-bemerkung").value.trim(),
    aufgezeichnet_am: Z.istDatum($("f-aufgezeichnet").value) ? $("f-aufgezeichnet").value : Z.heuteIso(),
  };
  const vorhanden = state.formularId && state.eintraege.find((x) => x.id === state.formularId);
  if (vorhanden) Object.assign(vorhanden, daten);
  else state.eintraege.push(Object.assign({ id: Z.neueId() }, daten));
  $("formular").close();
  await speichern();
  state.monat = datum.slice(0, 7);
  render();
}

async function formularLoeschen() {
  if (!confirm("Diesen Eintrag wirklich löschen?")) return;
  state.eintraege = state.eintraege.filter((x) => x.id !== state.formularId);
  $("formular").close();
  await speichern();
  render();
}

function zettelOeffnen() {
  const [jahr, monat] = state.monat.split("-").map(Number);
  if (!state.einst.name) toast("Tipp: Name und Firma unter „Einstellungen“ eintragen.");
  $("sheet-inhalt").innerHTML = Z.zettelHtml(state.einst, Z.imMonat(state.eintraege, jahr, monat), jahr, monat);
  $("sheet").classList.add("offen");
  $("sheet").scrollTop = 0;
}

function dateiHerunterladen(datei) {
  const url = URL.createObjectURL(datei);
  const a = document.createElement("a");
  a.href = url;
  a.download = datei.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function pdfTeilen() {
  const [jahr, monat] = state.monat.split("-").map(Number);
  const bytes = ZeitPdf.erzeuge(Z, state.einst, Z.imMonat(state.eintraege, jahr, monat), jahr, monat);
  const name = (state.einst.name || "stundenzettel").replace(/[^A-Za-z0-9äöüÄÖÜß]+/g, "_").replace(/^_|_$/g, "") || "stundenzettel";
  const datei = new File([bytes], "Stundenzettel_" + name + "_" + jahr + "-" + Z.pad(monat) + ".pdf", { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei] }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  dateiHerunterladen(datei);
}

async function sichern() {
  const heute = Z.heuteIso();
  const name = (state.einst.name || "daten").toLowerCase().replace(/[^a-z0-9äöüß]+/g, "_").replace(/^_|_$/g, "") || "daten";
  const datei = new File(["﻿" + Z.toCsv(state.eintraege)], "zeiterfassung_" + name + "_" + heute + ".csv", { type: "text/csv" });
  let geschafft = false;
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei] }); geschafft = true; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  if (!geschafft) { dateiHerunterladen(datei); geschafft = true; }
  state.einst.letzteSicherung = heute;
  await speichern();
  render();
  toast("Sicherung angelegt.");
}

async function wiederherstellen(datei) {
  if (!datei) return;
  const ergebnis = Z.parseCsv(await datei.text());
  if (!ergebnis.eintraege.length) {
    alert(ergebnis.fehler.length ? ergebnis.fehler.slice(0, 5).join("\n") : "Die Datei enthält keine Einträge.");
    return;
  }
  const z = Z.zusammenfuehren(state.eintraege, ergebnis.eintraege);
  state.eintraege = z.liste;
  await speichern();
  render();
  let text = z.hinzugefuegt + " Einträge ergänzt, " + z.doppelt + " waren schon vorhanden.";
  if (ergebnis.fehler.length) text += " " + ergebnis.fehler.length + " Zeilen übersprungen.";
  toast(text);
}

async function allesLoeschen() {
  if (!confirm("Wirklich ALLE Einträge und Einstellungen auf diesem Gerät löschen? Das geht nur mit einer Sicherung rückgängig.")) return;
  state.eintraege = [];
  state.einst = { name: "", firma: "", pers_nr: "", letzteSicherung: "" };
  await speichern();
  render();
}

const AKTIONEN = {
  ansicht: (w) => { state.ansicht = w; render(); window.scrollTo(0, 0); },
  start, ende, sichern,
  pause: (w) => setzePause(w),
  neu: () => formularOeffnen(null, state.ansicht === "monat" ? state.monat + "-01" : null),
  bearbeiten: (w) => formularOeffnen(w),
  "monat-wechsel": (w) => {
    const [j, m] = state.monat.split("-").map(Number);
    const d = new Date(j, m - 1 + Number(w), 1);
    state.monat = d.getFullYear() + "-" + Z.pad(d.getMonth() + 1);
    render();
  },
  zettel: zettelOeffnen,
  "zettel-zu": () => $("sheet").classList.remove("offen"),
  pdf: pdfTeilen,
  wiederherstellen: () => { $("datei").value = ""; $("datei").click(); },
  "alles-loeschen": allesLoeschen,
  "form-speichern": formularSpeichern,
  "form-abbrechen": () => $("formular").close(),
  "form-loeschen": formularLoeschen,
  "toast-knopf": () => { $("toast").classList.remove("sichtbar"); if (state.toastAktion) state.toastAktion(); },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-aktion]");
  if (!el || !AKTIONEN[el.dataset.aktion]) return;
  AKTIONEN[el.dataset.aktion](el.dataset.wert);
});

document.addEventListener("change", (ev) => {
  if (ev.target.dataset.aktionChange === "pause-frei") setzePause(ev.target.value);
});

let einstellungsTimer = null;
document.addEventListener("input", (ev) => {
  const feld = ev.target.dataset && ev.target.dataset.feld;
  if (!feld) return;
  state.einst[feld] = ev.target.value;
  clearTimeout(einstellungsTimer);
  einstellungsTimer = setTimeout(speichern, 400);
});

$("datei").addEventListener("change", (ev) => wiederherstellen(ev.target.files[0]));

// ---------- Start ----------

(async function init() {
  const zettelStil = document.createElement("style");
  zettelStil.textContent = Z.ZETTEL_CSS;
  document.head.appendChild(zettelStil);
  await Speicher.oeffnen();
  const e = await Speicher.lesen("eintraege");
  const s = await Speicher.lesen("einstellungen");
  if (Array.isArray(e)) state.eintraege = e;
  if (s) Object.assign(state.einst, s);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
